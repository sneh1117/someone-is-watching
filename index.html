<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Someone Is Watching</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
      letter-spacing: 1px;
    }

    #text {
      font-size: 2rem;
      opacity: 0;
      transition: opacity 2s ease;
      text-shadow: 0 0 5px rgba(255,255,255,0.2);
}
    

    .fade-in {
      opacity: 1;
    }

    .sub {
      font-size: 1rem;
      color: #888;
      margin-top: 10px;
    }

    .flicker {
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0% { opacity: 1; }
      50% { opacity: 0.8; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body>

  <div>
    <div id="text">Someone is watching you.</div>
    <div id="subtext" class="sub"></div>
  </div>

  <!-- Background Music -->
  <audio id="audio" loop>
  <source src="horror.mp3" type="audio/mpeg">
</audio>

  <script>
const text = document.getElementById("text");
const subtext = document.getElementById("subtext");
const audio = document.getElementById("audio");

let seconds = 0;
let audioStarted = false;

// Fade in main text
setTimeout(() => {
  text.classList.add("fade-in");
}, 2000);

// 👁️ AUDIO: click to start + slow fade-in
document.addEventListener("click", () => {
  if (audioStarted) return;
  audioStarted = true;

  audio.volume = 0;
  audio.play();

  let vol = 0;
  const fade = setInterval(() => {
    if (vol < 0.15) {
      vol += 0.005; // slower = creepier
      audio.volume = vol;
    } else {
      clearInterval(fade);
    }
  }, 200);
}, { once: true });

// Subtext messages over time
setTimeout(() => {
  subtext.innerText = "They’ve been here the whole time.";
}, 5000);

setTimeout(() => {
  subtext.innerText = "Why are you still here?";
}, 20000);

setTimeout(() => {
  subtext.innerText = "You can leave. I won’t.";
  audio.volume = 0.05; // lower = more eerie
}, 60000);

// Timer illusion (but slightly unsettling)
setInterval(() => {
  seconds++;
  if (seconds < 15) {
    subtext.innerText = `You've been here for ${seconds} seconds.`;
  }
}, 1000);

// 👁️ Mouse movement (DELAYED reaction = creepier)
let mouseTimeout;
document.addEventListener("mousemove", () => {
  clearTimeout(mouseTimeout);
  mouseTimeout = setTimeout(() => {
    subtext.innerText = "I see that.";
  }, 500);
});

// 👁️ Tab switch detection
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    subtext.innerText = "Welcome back.";
  }
});

// 👁️ Random creepy messages
const creepyMessages = [
  "Don't look behind you.",
  "This was a mistake.",
  "You're not alone.",
  "Why are you still here?",
  "It knows."
];

setInterval(() => {
  const msg = creepyMessages[Math.floor(Math.random() * creepyMessages.length)];
  subtext.innerText = msg;
}, 15000);

// 👁️ Flicker effect (randomized timing)
setInterval(() => {
  text.classList.toggle("flicker");
}, Math.random() * 4000 + 2000);

// 👁️ Hide cursor after some time
setTimeout(() => {
  document.body.style.cursor = "none";
}, 10000);

</script>

</body>
</html>
