<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Someone Is Watching</title>

<style>
body {
  margin: 0;
  background: black;
  color: #e0e0e0;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  text-align: center;
  letter-spacing: 1px;
  transition: transform 20s linear;
}

.zoom {
  transform: scale(1.05);
}

#text {
  font-size: 2.2rem;
  opacity: 1; /* always visible */
  font-weight: 500;
  transition: transform 0.1s;
  text-shadow: 0 0 12px rgba(255,255,255,0.4);
}

.fade-in {
  opacity: 1;
}

.sub {
  font-size: 0.9rem;
  color: #555;
  opacity: 0.7;
}

#popup {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #111;
  color: #ccc;
  padding: 10px 15px;
  border: 1px solid #333;
  font-size: 0.8rem;
  opacity: 0;
  transition: opacity 1s;
}
@keyframes creepyFlicker {
  0% { opacity: 1; }
  10% { opacity: 0; }
  20% { opacity: 1; }
  30% { opacity: 0.2; }
  40% { opacity: 1; }
  100% { opacity: 1; }
}

.flicker {
  animation: creepyFlicker 0.4s;
}
</style>
</head>

<body>

<div>
  <div id="text">Someone is watching you.</div>
  <div id="subtext" class="sub" style="margin-top:20px;"></div>
</div>

<div id="popup"></div>

<audio id="audio" loop>
  <source src="horror.mp3" type="audio/mpeg">
</audio>

<script>
const text = document.getElementById("text");
const subtext = document.getElementById("subtext");
const audio = document.getElementById("audio");
const popup = document.getElementById("popup");

const originalText = "Someone is watching you.";

let seconds = 0;
let audioStarted = false;
let phase = "intro";
let cursorX = 0;
let cursorY = 0;

// 👁️ always show correct text
text.innerText = originalText;

// 👁️ AUDIO FADE-IN
document.addEventListener("click", () => {
  if (audioStarted) return;
  audioStarted = true;

  audio.volume = 0;
  audio.play();

  let v = 0;
  const fade = setInterval(() => {
    if (v < 0.12) {
      v += 0.003;
      audio.volume = v;
    } else clearInterval(fade);
  }, 200);
}, { once: true });

// 👁️ Message system
function setMessage(msg) {
  subtext.style.opacity = 0;
  setTimeout(() => {
    subtext.innerText = msg;
    subtext.style.opacity = 1;
  }, 200);
}

// 👁️ Timeline
let timer = setInterval(() => {
  seconds++;

  if (seconds < 10) {
    setMessage(`You've been here for ${seconds} seconds.`);
  }

  if (seconds === 12) setMessage("They’ve been here the whole time.");
  if (seconds === 20) setMessage("Why are you still here?");
  if (seconds === 30) setMessage("This tab is still open.");

  if (seconds === 40) {
    phase = "creepy";
    setMessage("Don't look behind you.");
    document.body.classList.add("zoom");
  }

  if (seconds === 55) setMessage("It knows you're here.");

  if (seconds === 70) {
    endExperience();
    clearInterval(timer);
  }

}, 1000);

// 👁️ CURSOR FOLLOW + REACTION (merged cleanly)
let mouseTimeout;

document.addEventListener("mousemove", (e) => {
  if (phase !== "creepy") return;

  cursorX = (e.clientX / window.innerWidth - 0.5) * 10;
  cursorY = (e.clientY / window.innerHeight - 0.5) * 10;

  text.style.transform = `translate(${cursorX}px, ${cursorY}px)`;

  clearTimeout(mouseTimeout);
  mouseTimeout = setTimeout(() => {
    setMessage("I see that.");
  }, 400);
});

// 👁️ TAB SWITCH
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && seconds > 10) {
    setMessage("Welcome back.");
  }
});

// 👁️🔥 FIXED FLICKER (true randomness)
function triggerFlicker() {
  if (phase !== "creepy") return;

  text.classList.add("flicker");

  setTimeout(() => {
    text.classList.remove("flicker");
  }, 300);

  // schedule next flicker randomly
  setTimeout(triggerFlicker, Math.random() * 4000 + 2000);
}

// start flicker after creepy phase begins
setTimeout(triggerFlicker, 5000);

// 👁️🔥 WORKING GLITCH SYSTEM

let glitchIntensity = 0.1;
let glitchInterval = null;

// start glitch WHEN creepy phase begins
function startGlitch() {
  if (glitchInterval) return; // prevent duplicate intervals

  glitchInterval = setInterval(() => {
    glitchText();
  }, 1200);
}

// trigger glitch when phase changes
setInterval(() => {
  if (phase === "creepy") {
    startGlitch();
  }
}, 1000);

// increase intensity over time
setInterval(() => {
  if (phase !== "creepy") return;
  glitchIntensity = Math.min(glitchIntensity + 0.015, 0.3);
}, 5000);

function glitchText() {
  let chars = originalText.split("");

  for (let i = 0; i < chars.length; i++) {
    if (Math.random() < glitchIntensity) {
      const glitchChars = ["#", "@", "%", "&", "_"];
      chars[i] = glitchChars[Math.floor(Math.random() * glitchChars.length)];
    }
  }

  text.innerText = chars.join("");

  // stronger visual effect so you NOTICE it
  text.style.filter = "blur(1.5px) contrast(1.2)";

  setTimeout(() => {
    text.innerText = originalText;
    text.style.filter = "none";
  }, 150);
}

// delayed glitch start
setTimeout(() => {
  setInterval(() => {
    if (phase !== "creepy") return;
    glitchText();
  }, 1500);
}, 5000);

// 👁️ AUDIO INSTABILITY
setInterval(() => {
  if (!audioStarted) return;
  audio.volume = 0.07 + Math.random() * 0.05;
}, 3000);

// 👁️ FAKE CAMERA POPUP
setTimeout(() => {
  popup.innerText = "Camera access granted.";
  popup.style.opacity = 1;
}, 25000);

// 👁️ FAKE SYSTEM MESSAGE
setTimeout(() => {
  popup.innerText = "Tracking enabled.";
}, 40000);

// 👁️ CURSOR DISAPPEAR
setTimeout(() => {
  document.body.style.cursor = "none";
}, 15000);

// 👁️ ENDING
function endExperience() {
  audio.pause();

  document.body.innerHTML = `
    <h1 style="color:white; font-weight:300;">
      I saw that.
    </h1>
  `;
}
</script>

</body>
</html>
