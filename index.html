<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>...</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  cursor: default;
}

#videoContainer {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  opacity: 0;
  transition: opacity 2s ease;
  z-index: 1;
}

#video {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: grayscale(1) contrast(1.2) brightness(0.7);
}

#ghostCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  opacity: 0;
  z-index: 2;
  pointer-events: none;
  mix-blend-mode: screen;
}

#faceCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  opacity: 0;
  z-index: 1;
  pointer-events: none;
  filter: blur(1px);
}

#content {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 3;
  text-align: center;
  background: rgba(0,0,0,0.6);
  transition: background 3s ease;
}

#text {
  font-size: 2.8rem;
  font-weight: 300;
  letter-spacing: 3px;
  opacity: 1;
  transition: all 0.3s ease;
  text-shadow: 0 0 20px rgba(255,255,255,0.3);
  position: relative;
}

#subtext {
  font-size: 1rem;
  color: #666;
  margin-top: 30px;
  letter-spacing: 2px;
  opacity: 0;
  transition: opacity 0.5s ease;
  max-width: 80%;
}

#permissionScreen {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #000;
  z-index: 999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: opacity 1s ease;
}

#permissionScreen.hidden {
  opacity: 0;
  pointer-events: none;
}

.permission-text {
  font-size: 1.2rem;
  margin-bottom: 30px;
  color: #888;
  letter-spacing: 1px;
}

#allowBtn {
  background: transparent;
  border: 1px solid #444;
  color: #ccc;
  padding: 15px 40px;
  font-size: 1rem;
  font-family: 'Courier New', monospace;
  cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.3s ease;
}

#allowBtn:hover {
  background: #111;
  border-color: #666;
  color: #fff;
}

@keyframes glitchShake {
  0%, 100% { transform: translate(0, 0); }
  10% { transform: translate(-2px, 2px); }
  20% { transform: translate(-3px, -1px); }
  30% { transform: translate(3px, 2px); }
  40% { transform: translate(-1px, -2px); }
  50% { transform: translate(2px, 1px); }
  60% { transform: translate(1px, -3px); }
  70% { transform: translate(-3px, 1px); }
  80% { transform: translate(3px, -2px); }
  90% { transform: translate(-2px, -1px); }
}

.glitch-active { animation: glitchShake 0.08s infinite; }
.glitch-rgb {
  text-shadow: 2px 0 #ff0000, -2px 0 #00ffff, 0 0 20px rgba(255,255,255,0.5);
}

#vignette {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(0,0,0,0.8) 100%);
  pointer-events: none;
  z-index: 4;
  opacity: 0;
  transition: opacity 2s ease;
}

#static {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  opacity: 0;
  pointer-events: none;
  z-index: 5;
  background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAMAAAAp4XiDAAAAUVBMVEX///8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAhNKf6AAAAGnRSTlMAAQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRpym3hBAAAA9ElEQVR4Ae3SRw4DIRAEQW9gx+z5/1nZkYg3tOMDVHOB5k/qg+ABDY4HfPyRAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIB/ewF0AgMX7gfhggAAAABJRU5ErkJggg==');
  animation: staticNoise 0.2s infinite;
}

@keyframes staticNoise {
  0%   { transform: translate(0, 0); }
  10%  { transform: translate(-5%, -5%); }
  20%  { transform: translate(-10%, 5%); }
  30%  { transform: translate(5%, -10%); }
  40%  { transform: translate(-5%, 15%); }
  50%  { transform: translate(-10%, 5%); }
  60%  { transform: translate(15%, 0); }
  70%  { transform: translate(0, 10%); }
  80%  { transform: translate(-15%, 0); }
  90%  { transform: translate(10%, 5%); }
  100% { transform: translate(5%, 0); }
}

.popup-msg {
  position: fixed;
  bottom: 20px; right: 20px;
  background: rgba(20,20,20,0.95);
  border: 1px solid #333;
  color: #999;
  padding: 12px 20px;
  font-size: 0.75rem;
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 100;
  font-family: 'Courier New', monospace;
}

@keyframes screenFlash {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.8; }
}

.flash {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: white;
  z-index: 999;
  pointer-events: none;
  opacity: 0;
}

.text-distort {
  filter: blur(1px);
  transform: scaleY(1.02);
}

@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

.breathing { animation: breathe 4s ease-in-out infinite; }

#finalMessage {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 2s ease;
}

#finalMessage h1 {
  font-size: 3rem;
  font-weight: 300;
  letter-spacing: 4px;
  color: #fff;
  text-shadow: 0 0 30px rgba(255,255,255,0.5);
}
</style>
</head>

<body>

<div id="permissionScreen">
  <div class="permission-text">This experience requires camera access</div>
  <button id="allowBtn">ALLOW</button>
</div>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
</div>

<canvas id="faceCanvas"></canvas>
<canvas id="ghostCanvas"></canvas>

<div id="vignette"></div>
<div id="static"></div>
<div id="flash" class="flash"></div>

<div id="content">
  <div id="text">Someone is watching you.</div>
  <div id="subtext"></div>
</div>

<div id="popup" class="popup-msg"></div>

<div id="finalMessage">
  <h1>I saw everything.</h1>
</div>

<audio id="ambientAudio" loop>
  <source src="horror.mp3" type="audio/mpeg">
</audio>

<script>
const video        = document.getElementById('video');
const videoContainer = document.getElementById('videoContainer');
const ghostCanvas  = document.getElementById('ghostCanvas');
const ghostCtx     = ghostCanvas.getContext('2d');
const faceCanvas   = document.getElementById('faceCanvas');
const faceCtx      = faceCanvas.getContext('2d');
const text         = document.getElementById('text');
const subtext      = document.getElementById('subtext');
const content      = document.getElementById('content');
const vignette     = document.getElementById('vignette');
const staticEl     = document.getElementById('static');
const flash        = document.getElementById('flash');
const popup        = document.getElementById('popup');
const ambientAudio = document.getElementById('ambientAudio');
const finalMessage = document.getElementById('finalMessage');
const permissionScreen = document.getElementById('permissionScreen');
const allowBtn     = document.getElementById('allowBtn');

let seconds = 0;
let phase = 'intro';
let cameraActive = false;
let ghostFrames = [];
let ghostOpacity = 0;
let audioStarted = false;
let faceOpacity = 0;

ghostCanvas.width = window.innerWidth;
ghostCanvas.height = window.innerHeight;
faceCanvas.width = window.innerWidth;
faceCanvas.height = window.innerHeight;

const messages = [
  "I can see you clearly now.",
  "Don't move.",
  "You look different on camera.",
  "Is that really you?",
  "Something is behind you.",
  "They're getting closer.",
  "Can you feel it breathing?",
  "Look at your reflection.",
  "It knows your face.",
  "You shouldn't have allowed this.",
  "Wave to the camera.",
  "Smile.",
  "TURN AROUND",
  "IT'S WATCHING YOU BACK",
  "DON'T LOOK AWAY",
  "I SEE YOU"
];

allowBtn.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });

    video.srcObject = stream;
    cameraActive = true;

    permissionScreen.classList.add('hidden');
    setTimeout(() => { permissionScreen.style.display = 'none'; }, 1000);

    // Faster fade-in to match compressed timeline
    setTimeout(() => {
      videoContainer.style.opacity = '0.5';
      vignette.style.opacity = '1';
    }, 1000);

    setTimeout(() => { captureGhostFrame(); }, 4000);

    startExperience();

  } catch (err) {
    permissionScreen.querySelector('.permission-text').innerText = 'Camera access denied. Refresh to try again.';
    allowBtn.style.display = 'none';
  }
});

function startExperience() {
  setTimeout(() => {
    if (!audioStarted) {
      audioStarted = true;
      ambientAudio.volume = 0.15;
      ambientAudio.play().catch(() => {});
    }
  }, 500);

  const timer = setInterval(() => {
    seconds++;

    // PHASE 1: AWARENESS (0–8s) — condensed from 0–15s
    if (seconds === 2)  setMessage("The camera is recording.");
    if (seconds === 4)  setMessage("I can see you clearly now.");
    if (seconds === 6) {
      setMessage("Something doesn't feel right.");
      content.style.background = 'rgba(0,0,0,0.4)';
    }

    // PHASE 2: UNEASE (8–15s) — condensed from 15–30s
    if (seconds === 8) {
      triggerFlash();
      startCreepyFace();
    }
    if (seconds === 10) setMessage("Don't look away from the screen.");
    if (seconds === 12) {
      setMessage("They've been watching you the whole time.");
      staticEl.style.opacity = '0.03';
    }

    // PHASE 3: TERROR (15–22s) — condensed from 30–50s
    if (seconds === 15) {
      phase = 'terror';
      setMessage("Look behind you.");
      startGhostEffect();
      startIntenseGlitch();
      videoContainer.style.opacity = '0.7';
    }
    if (seconds === 17) {
      document.body.style.cursor = 'none';
      triggerFlash();
    }
    if (seconds === 19) {
      setMessage("IT'S RIGHT BEHIND YOU");
      ghostOpacity = 0.4;
      staticEl.style.opacity = '0.08';
    }
    if (seconds === 21) {
      showPopup("Location tracked.");
      triggerFlash();
    }

    // PHASE 4: CLIMAX (22–30s) — condensed from 50–70s
    if (seconds === 22) {
      phase = 'climax';
      content.style.background = 'rgba(0,0,0,0.2)';
      videoContainer.style.opacity = '0.9';
      ghostOpacity = 0.6;
      text.classList.add('breathing');
    }
    if (seconds === 24) {
      setMessage("Can you see it in the camera?");
      triggerFlash();
    }
    if (seconds === 26) {
      showPopup("Recording saved.");
      staticEl.style.opacity = '0.12';
    }
    if (seconds === 28) {
      setMessage("Don't turn around.");
      triggerFlash();
    }

    // END at 30s
    if (seconds === 30) {
      endExperience();
      clearInterval(timer);
    }

  }, 1000);
}

function setMessage(msg) {
  subtext.style.opacity = '0';
  setTimeout(() => {
    subtext.innerText = msg;
    subtext.style.opacity = '1';
  }, 300);
}

function showPopup(msg) {
  popup.innerText = msg;
  popup.style.opacity = '1';
  setTimeout(() => { popup.style.opacity = '0'; }, 4000);
}

function captureGhostFrame() {
  if (!cameraActive || !video.videoWidth) {
    setTimeout(captureGhostFrame, 500);
    return;
  }
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = video.videoWidth;
  tempCanvas.height = video.videoHeight;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(video, 0, 0);
  ghostFrames.push(tempCanvas);
  if (ghostFrames.length > 5) ghostFrames.shift();
  setTimeout(captureGhostFrame, 2000);
}

function startGhostEffect() {
  setInterval(() => {
    if (ghostFrames.length === 0 || (phase !== 'terror' && phase !== 'climax')) return;
    ghostCtx.clearRect(0, 0, ghostCanvas.width, ghostCanvas.height);
    const randomFrame = ghostFrames[Math.floor(Math.random() * ghostFrames.length)];
    const offsetX = (Math.random() - 0.5) * 200;
    const offsetY = (Math.random() - 0.5) * 100 - 50;
    ghostCtx.save();
    ghostCtx.globalAlpha = ghostOpacity * (0.3 + Math.random() * 0.3);
    ghostCtx.filter = 'blur(4px) brightness(1.5) contrast(0.8)';
    const scale = 0.8 + Math.random() * 0.3;
    const drawWidth = ghostCanvas.width * scale;
    const drawHeight = ghostCanvas.height * scale;
    const x = (ghostCanvas.width - drawWidth) / 2 + offsetX;
    const y = (ghostCanvas.height - drawHeight) / 2 + offsetY;
    ghostCtx.drawImage(randomFrame, x, y, drawWidth, drawHeight);
    ghostCtx.restore();
    if (Math.random() < 0.3) {
      ghostCtx.fillStyle = 'rgba(255, 0, 0, 0.05)';
      ghostCtx.fillRect(0, 0, ghostCanvas.width, ghostCanvas.height);
    }
  }, 150);
  ghostCanvas.style.opacity = '1';
}

function drawCreepyFace() {
  faceCtx.clearRect(0, 0, faceCanvas.width, faceCanvas.height);
  const centerX = faceCanvas.width / 2;
  const centerY = faceCanvas.height / 2;
  const faceX = centerX + (Math.random() - 0.5) * 100;
  const faceY = centerY * 0.6 + (Math.random() - 0.5) * 50;
  const faceSize = 150 + Math.random() * 50;
  faceCtx.save();
  faceCtx.globalAlpha = faceOpacity;
  faceCtx.fillStyle = '#ddd';
  faceCtx.beginPath();
  faceCtx.ellipse(faceX, faceY, faceSize * 0.7, faceSize, 0, 0, Math.PI * 2);
  faceCtx.fill();
  faceCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  faceCtx.beginPath();
  faceCtx.ellipse(faceX, faceY + faceSize * 0.3, faceSize * 0.5, faceSize * 0.4, 0, 0, Math.PI * 2);
  faceCtx.fill();
  const eyeOffsetX = faceSize * 0.3;
  const eyeOffsetY = faceSize * 0.2;
  const eyeSize = faceSize * 0.15;
  faceCtx.fillStyle = '#000';
  faceCtx.beginPath();
  faceCtx.ellipse(faceX - eyeOffsetX, faceY - eyeOffsetY, eyeSize, eyeSize * 1.3, 0, 0, Math.PI * 2);
  faceCtx.fill();
  faceCtx.beginPath();
  faceCtx.ellipse(faceX + eyeOffsetX, faceY - eyeOffsetY, eyeSize, eyeSize * 1.3, 0, 0, Math.PI * 2);
  faceCtx.fill();
  if (Math.random() < 0.7) {
    faceCtx.fillStyle = '#fff';
    const pupilSize = eyeSize * 0.2;
    faceCtx.beginPath();
    faceCtx.arc(faceX - eyeOffsetX, faceY - eyeOffsetY, pupilSize, 0, Math.PI * 2);
    faceCtx.fill();
    faceCtx.beginPath();
    faceCtx.arc(faceX + eyeOffsetX, faceY - eyeOffsetY, pupilSize, 0, Math.PI * 2);
    faceCtx.fill();
  }
  faceCtx.strokeStyle = '#000';
  faceCtx.lineWidth = 3;
  faceCtx.beginPath();
  faceCtx.moveTo(faceX - faceSize * 0.3, faceY + faceSize * 0.4);
  faceCtx.quadraticCurveTo(faceX, faceY + faceSize * 0.5, faceX + faceSize * 0.3, faceY + faceSize * 0.4);
  faceCtx.stroke();
  if (Math.random() < 0.3) {
    faceCtx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
    faceCtx.lineWidth = 2;
    faceCtx.beginPath();
    faceCtx.moveTo(faceX - eyeOffsetX, faceY - eyeOffsetY + eyeSize);
    faceCtx.lineTo(faceX - eyeOffsetX, faceY + faceSize * 0.3);
    faceCtx.stroke();
  }
  faceCtx.restore();
  if (Math.random() < 0.15) faceOpacity *= 0.5;
}

function startCreepyFace() {
  faceCanvas.style.opacity = '1';
  const faceInterval = setInterval(() => {
    if (phase !== 'terror' && phase !== 'climax') {
      clearInterval(faceInterval);
      return;
    }
    drawCreepyFace();
    if (faceOpacity < 0.4 && phase === 'terror')  faceOpacity += 0.015;
    if (faceOpacity < 0.7 && phase === 'climax')  faceOpacity += 0.03;
  }, 100);
}

function startIntenseGlitch() {
  setInterval(() => {
    if (phase !== 'terror' && phase !== 'climax') return;
    const intensity = phase === 'climax' ? 0.6 : 0.4;
    if (Math.random() < intensity) {
      text.classList.add('glitch-active', 'glitch-rgb');
      if (Math.random() < 0.4) {
        const msg = messages[Math.floor(Math.random() * messages.length)];
        text.innerText = msg;
        text.style.color = Math.random() < 0.5 ? '#ff4d4d' : '#fff';
      }
      if (Math.random() < 0.5) {
        const msg = messages[Math.floor(Math.random() * messages.length)];
        subtext.innerText = msg;
        subtext.style.color = '#ff4d4d';
        subtext.style.opacity = '1';
      }
      if (Math.random() < 0.3) content.classList.add('text-distort');
      setTimeout(() => {
        text.classList.remove('glitch-active', 'glitch-rgb');
        text.innerText = 'Someone is watching you.';
        text.style.color = '#e0e0e0';
        subtext.style.color = '#666';
        content.classList.remove('text-distort');
      }, 100);
    }
  }, 400);
}

function triggerFlash() {
  flash.style.animation = 'screenFlash 0.3s ease';
  setTimeout(() => { flash.style.animation = ''; }, 300);
}

let mouseTimeout;
document.addEventListener('mousemove', (e) => {
  if (phase !== 'terror' && phase !== 'climax') return;
  const x = (e.clientX / window.innerWidth - 0.5) * 15;
  const y = (e.clientY / window.innerHeight - 0.5) * 15;
  text.style.transform = `translate(${x}px, ${y}px)`;
  clearTimeout(mouseTimeout);
  mouseTimeout = setTimeout(() => {
    if (Math.random() < 0.5) setMessage("I see that.");
  }, 800);
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && seconds > 6) {
    setMessage("You came back.");
    triggerFlash();
  }
});

function endExperience() {
  staticEl.style.opacity = '0';
  ghostCanvas.style.opacity = '0';
  faceCanvas.style.opacity = '0';
  content.style.opacity = '0';
  setTimeout(() => {
    finalMessage.style.opacity = '1';
    finalMessage.style.pointerEvents = 'all';
  }, 1000);
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
  }
  ambientAudio.pause();
}

window.addEventListener('resize', () => {
  ghostCanvas.width = window.innerWidth;
  ghostCanvas.height = window.innerHeight;
  faceCanvas.width = window.innerWidth;
  faceCanvas.height = window.innerHeight;
});
</script>

</body>
</html>
